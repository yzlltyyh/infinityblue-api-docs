type: object
required: [type, image_url]
properties:
  type:
    type: string
    enum: [image_url]
  image_url:
    type: object
    required: [url]
    properties:
      url:
        type: string
        format: uri
        description: |
          Image URL or `data:image/jpeg;base64,...` data URI.
        example: https://example.com/cat.jpg
      detail:
        type: string
        enum: [auto, low, high]
        default: auto
        description: |
          Processing detail level. `low` uses 512×512 thumbnail (cheap),
          `high` does detailed analysis (expensive), `auto` lets the
          model decide.
