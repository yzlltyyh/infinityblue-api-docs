get:
  tags: [models]
  summary: List models (Gemini format)
  description: |
    Lists models in Google Gemini's native response format.
    Useful when integrating with existing Gemini code.
  operationId: listModelsGemini
  x-mint:
    metadata:
      title: List models (Gemini format)
      sidebarTitle: List models (Gemini)
      description: List models in Google Gemini native format
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              models:
                type: array
                items:
                  $ref: ../components/schemas/model-info.yaml
              nextPageToken:
                type: [string, "null"]
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
