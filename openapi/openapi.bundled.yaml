openapi: 3.1.0
info:
  title: InfinityBlue API
  version: 1.0.0
  summary: Unified OpenAI-compatible API gateway
  description: |
    InfinityBlue is a unified API gateway for AI models. It exposes
    OpenAI-compatible endpoints for chat, images, videos, embeddings,
    and more — backed by 100+ models from OpenAI, Anthropic, Google,
    ByteDance, and Stability.

    ## Authentication

    All requests require a Bearer token:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## Endpoint format conventions

    - `/v1/*` — OpenAI-compatible (and OpenAI Responses)
    - `/v1/messages` — Anthropic Messages format
    - `/v1beta/models/*:generateContent` — Google Gemini native format

    ## Model selection

    Pass any model ID in the `model` parameter. See
    [`GET /v1/models`](/api-reference/models/list-models) for the full
    list. Common IDs:
    - Chat: `gpt-4o`, `gpt-5`, `claude-sonnet-4-6`, `gemini-2.5-pro`
    - Image: `gpt-image-1`, `dall-e-3`, `flux-pro-1.1`
    - Video: `seedance-2.0`, `veo_3_1-fast`, `sora-2`

    ## Rate limits

    Per API key:
    - 60 requests/minute
    - 500,000 tokens/minute

    Higher tiers available in the dashboard.
  contact:
    name: InfinityBlue Support
    email: support@infinityblue.com
    url: https://infinityblue.com/support
  license:
    name: Proprietary
    url: https://infinityblue.com/terms
servers:
  - url: https://api.infinityblue.com
    description: Production
    variables: {}
security:
  - bearerAuth: []
tags:
  - name: models
    description: List and discover available models
  - name: chat
    description: |
      Chat completions. Multiple endpoint formats supported:
      - `/v1/chat/completions` — OpenAI Chat Completions (recommended)
      - `/v1/responses` — OpenAI Responses
      - `/v1/messages` — Anthropic Messages
      - `/v1beta/models/{model}:generateContent` — Google Gemini
  - name: images
    description: |
      Image generation and editing.
      - `/v1/images/*` — OpenAI Images
      - `/v1beta/models/*:generateContent` — Google Gemini (Nano Banana etc.)
  - name: videos
    description: |
      Async video generation. Submit a task, then poll or use
      webhooks to receive completion.
      - `/v1/videos` — main endpoint (supports Seedance, Veo, Sora, Kling)
      - `/v1/video/generations` — legacy alias (deprecated)
paths:
  /v1/models:
    get:
      tags:
        - models
      summary: List available models
      description: |
        Lists all models currently available through InfinityBlue.
        Use this to discover model IDs for the `model` parameter
        of other endpoints.
      operationId: listModels
      x-mint:
        metadata:
          title: List models
          sidebarTitle: List models
          description: Discover all models available through InfinityBlue
      responses:
        '200':
          $ref: '#/components/responses/model-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rate-limited'
  /v1/chat/completions:
    post:
      tags:
        - chat
      summary: Create chat completion (OpenAI format)
      description: |
        OpenAI-compatible chat completions. Works with any model in
        InfinityBlue (OpenAI, Anthropic, Google, etc.).

        For native Anthropic format use `/v1/messages`.
        For native Gemini format use `/v1beta/models/{model}:generateContent`.
      operationId: createChatCompletion
      x-mint:
        metadata:
          title: Chat completions
          sidebarTitle: Chat completions
          description: |
            Generate text, vision, tool-calling, and streaming responses
            in OpenAI-compatible format
        content: |
          ## Streaming

          Set `stream: true` to receive Server-Sent Events. See the
          [Streaming guide](/guides/streaming) for details.

          ## Reasoning models

          For `o-series`, `claude-3-7-sonnet-thinking`, or `gemini-2.5-pro-thinking`,
          the model returns reasoning tokens in a separate `reasoning_content`
          field. Render them collapsed in your UI.

          ## Tool calling

          Up to 128 tools per request. Set `tool_choice` to control which
          tool the model calls (`auto`, `none`, `required`, or force a specific
          function name).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chat-completion-request'
            examples:
              gpt4o_simple:
                summary: Simple chat with GPT-4o
                value:
                  model: gpt-4o
                  messages:
                    - role: user
                      content: Hello!
              claude_streaming:
                summary: Streaming with Claude
                value:
                  model: claude-sonnet-4-6
                  stream: true
                  messages:
                    - role: user
                      content: Write a haiku about programming
              vision:
                summary: Vision input
                value:
                  model: gpt-4o
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: What's in this image?
                        - type: image_url
                          image_url:
                            url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/640px-Cat03.jpg
              tool_calling:
                summary: Function calling
                value:
                  model: gpt-4o
                  messages:
                    - role: user
                      content: What's the weather in Paris?
                  tools:
                    - type: function
                      function:
                        name: get_weather
                        description: Get current weather for a city
                        parameters:
                          type: object
                          properties:
                            location:
                              type: string
                              description: City name
                          required:
                            - location
                  tool_choice: auto
              json_mode:
                summary: Structured output (JSON schema)
                value:
                  model: gpt-4o
                  messages:
                    - role: system
                      content: Extract the city and country from the user's message.
                    - role: user
                      content: I just moved to Paris, France
                  response_format:
                    type: json_schema
                    json_schema:
                      name: location
                      schema:
                        type: object
                        properties:
                          city:
                            type: string
                          country:
                            type: string
                        required:
                          - city
                          - country
                        additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chat-completion-response'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events when `stream=true`. Each line is
                  `data: {json}`. Stream ends with `data: [DONE]`.
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/responses:
    post:
      tags:
        - chat
      summary: Create response (OpenAI Responses format)
      description: |
        OpenAI Responses API format. Recommended for new applications
        that need built-in tool use (web search, file search, code interpreter)
        and stateful conversations.

        For most chat use cases, `/v1/chat/completions` is sufficient.
      operationId: createResponse
      x-mint:
        metadata:
          title: Responses
          sidebarTitle: Responses (OpenAI format)
          description: OpenAI Responses API — built-in tools and stateful conversations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  example: gpt-5
                input:
                  type: array
                  description: |
                    List of input items. Can be plain text strings or
                    structured items (messages, tool results, function calls).
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          role:
                            type: string
                            enum:
                              - user
                              - assistant
                              - system
                              - developer
                          content:
                            type: string
                instructions:
                  type: string
                  description: |
                    System-level instructions. Equivalent to a `system` message
                    at the start of `input`.
                previous_response_id:
                  type: string
                  description: |
                    Chain to a previous response. When set, the model sees
                    the full conversation history of the previous response.
                    Use this for stateful multi-turn without resending all
                    messages.
                tools:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:
                          - web_search
                          - file_search
                          - function
                          - code_interpreter
                stream:
                  type: boolean
                  default: false
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 1
                max_output_tokens:
                  type: integer
                  minimum: 1
                user:
                  type: string
            examples:
              basic:
                value:
                  model: gpt-5
                  input: What's the capital of France?
              stateful:
                summary: Stateful multi-turn via previous_response_id
                value:
                  model: gpt-5
                  previous_response_id: resp_abc123
                  input: Now translate that to Japanese
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: resp_abc123
                  object:
                    type: string
                    enum:
                      - response
                  created_at:
                    type: integer
                  model:
                    type: string
                  status:
                    type: string
                    enum:
                      - completed
                      - failed
                      - in_progress
                      - cancelled
                  output:
                    type: array
                    items:
                      type: object
                  usage:
                    $ref: '#/components/schemas/usage'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/messages:
    post:
      tags:
        - chat
      summary: Create message (Anthropic Messages format)
      description: |
        Native Anthropic Messages API format. Use this when you want full
        access to Anthropic-specific features:
        - Prompt caching (explicit cache breakpoints)
        - Extended thinking with budget control
        - PDF input
        - Citations
        - Computer use (beta)

        For general cross-model chat, use `/v1/chat/completions` instead.
      operationId: createMessage
      x-mint:
        metadata:
          title: Messages (Anthropic)
          sidebarTitle: Messages (Anthropic)
          description: Native Anthropic Messages API — full feature access
        content: |
          ## Extended thinking

          Add `"thinking": {"type": "enabled", "budget_tokens": 5000}` to enable
          chain-of-thought. The response will include a `thinking` content block
          alongside the `text` block.

          ## Prompt caching

          Mark cache breakpoints with `"cache_control": {"type": "ephemeral"}`
          on a content block. Subsequent requests with the same prefix get
          up to 90% discount on cached tokens.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - max_tokens
                - messages
              properties:
                model:
                  type: string
                  example: claude-sonnet-4-6
                max_tokens:
                  type: integer
                  minimum: 1
                  description: |
                    Maximum tokens to generate. **Required** in Messages API
                    (unlike Chat Completions where it is optional).
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: object
                              required:
                                - type
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - text
                                    - image
                                    - document
                                    - tool_use
                                    - tool_result
                                    - thinking
                system:
                  type: string
                  description: |
                    System prompt. Equivalent to a `system` message in
                    Chat Completions.
                temperature:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 1
                top_p:
                  type: number
                  minimum: 0
                  maximum: 1
                top_k:
                  type: integer
                  minimum: 0
                  description: |
                    Sample from the top K options at each step. Lower = more focused.
                stop_sequences:
                  type: array
                  items:
                    type: string
                stream:
                  type: boolean
                  default: false
                thinking:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - enabled
                        - disabled
                    budget_tokens:
                      type: integer
                      minimum: 1024
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      input_schema:
                        type: object
                tool_choice:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - auto
                        - any
                        - tool
                        - none
                    name:
                      type: string
                metadata:
                  type: object
                  properties:
                    user_id:
                      type: string
                      description: Unique end-user ID for abuse detection
            examples:
              basic:
                value:
                  model: claude-sonnet-4-6
                  max_tokens: 1024
                  messages:
                    - role: user
                      content: Hello!
              with_thinking:
                summary: Extended thinking
                value:
                  model: claude-sonnet-4-6
                  max_tokens: 8000
                  thinking:
                    type: enabled
                    budget_tokens: 5000
                  messages:
                    - role: user
                      content: 'Solve: x^2 - 4x + 3 = 0'
              with_cache:
                summary: Prompt caching
                value:
                  model: claude-sonnet-4-6
                  max_tokens: 1024
                  system: |
                    You are an expert legal analyst. [long system prompt]
                    <cache_break>
                  messages:
                    - role: user
                      content: Summarize contract
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: msg_abc123
                  type:
                    type: string
                    enum:
                      - message
                  role:
                    type: string
                    enum:
                      - assistant
                  content:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          enum:
                            - text
                            - thinking
                            - tool_use
                        text:
                          type: string
                        thinking:
                          type: string
                        id:
                          type: string
                          description: For tool_use blocks
                        name:
                          type: string
                        input:
                          type: object
                  model:
                    type: string
                  stop_reason:
                    type: string
                    enum:
                      - end_turn
                      - max_tokens
                      - stop_sequence
                      - tool_use
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                      output_tokens:
                        type: integer
                      cache_creation_input_tokens:
                        type: integer
                        description: Tokens written to cache
                      cache_read_input_tokens:
                        type: integer
                        description: Tokens served from cache
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/images/generations:
    post:
      tags:
        - images
      summary: Create image (OpenAI format)
      description: |
        Generate images from a text prompt. OpenAI Images-compatible.
        For image editing (inpainting, multi-image edit), use `/v1/images/edits`.
        For native Gemini image generation (Nano Banana), use
        `/v1beta/models/{model}:generateContent`.
      operationId: createImage
      x-mint:
        metadata:
          title: Generate images
          sidebarTitle: Generate images
          description: Text-to-image generation across multiple model providers
        content: |
          ## Model selection

          - `gpt-image-1` — best quality, supports `transparent` background,
            multi-image edit, `low/medium/high/auto` quality levels
          - `dall-e-3` — reliable, supports `vivid`/`natural` style
          - `flux-pro-1.1` — photorealistic, artistic
          - `qwen-image` — best for **Chinese text** in images
          - `sd-3.5-large` — open-weights style, customizable

          ## Output formats

          - `url` (default) — temporary URL, expires in 60 minutes
          - `b64_json` — base64-encoded PNG bytes (for permanent storage)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/image-generation-request'
            examples:
              gpt_image_1:
                summary: gpt-image-1 high quality
                value:
                  model: gpt-image-1
                  prompt: A serene mountain landscape at sunset, oil painting style
                  size: 1536x1024
                  quality: high
              dall_e_3:
                summary: DALL-E 3 with style
                value:
                  model: dall-e-3
                  prompt: A cute robot reading a book in a cozy library
                  size: 1024x1024
                  style: natural
              qwen_chinese_text:
                summary: qwen-image with Chinese text in image
                value:
                  model: qwen-image
                  prompt: A vintage poster that says "复古海报" in bold red Chinese characters, art deco style
                  size: 1024x1536
              multiple_images:
                value:
                  model: gpt-image-1
                  prompt: A serene mountain landscape at sunset
                  'n': 4
                  size: 1024x1024
              transparent_bg:
                value:
                  model: gpt-image-1
                  prompt: A red apple, isolated on white
                  background: transparent
                  output_format: png
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/image-generation-response'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/images/edits:
    post:
      tags:
        - images
      summary: Edit image (OpenAI format)
      description: |
        Edit or extend images using a prompt and optional mask.
        OpenAI Images-compatible.

        **Send as `multipart/form-data`**, not JSON.
      operationId: editImage
      x-mint:
        metadata:
          title: Edit images
          sidebarTitle: Edit images
          description: Inpaint, outpaint, and multi-image edits
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/image-edit-request'
            encoding:
              image:
                contentType: image/png, image/jpeg, image/webp
              mask:
                contentType: image/png
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/image-generation-response'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '413':
          description: |
            Image too large. Max size is 4MB for `image` and 4MB for `mask`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/videos:
    post:
      tags:
        - videos
      summary: Create video generation task
      description: |
        Submit a video generation task. Async — you receive a `VideoTask`
        immediately with `status=queued` or `in_progress`. Poll
        `GET /v1/videos/{task_id}` to check progress, or register a webhook
        to be notified on completion.

        **All video models share this endpoint.** The model is selected via
        the `model` parameter; supported parameters and output formats
        vary by model — see the [model reference](/guides/model-selection).

        ## Supported models

        | Model | Duration | Resolutions | Notable features |
        |---|---|---|---|
        | `seedance-2.0` | 5s, 10s | 720p, 1080p | Ref images, fast |
        | `veo_3_1-fast` | 8s | 720p, 1080p | Audio generation, ref images |
        | `veo_3_1-pro` | 8s | 720p, 1080p, 4K | Highest quality, audio |
        | `sora-2` | 5s, 10s, 15s, 20s | 1080p | Long-form, cinematic |
        | `kling-1.6-pro` | 5s, 10s | 1080p | Strong motion, character ref |
      operationId: createVideo
      x-mint:
        metadata:
          title: Create video
          sidebarTitle: Create video
          description: |
            Async video generation. Returns a task ID — poll for completion
            or use webhooks.
        content: |
          ## Webhooks vs polling

          **Recommended for production**: register a webhook URL in your
          dashboard. The gateway will POST the completed `VideoTask` to
          your endpoint when the video is ready.

          **For quick tests**: poll `GET /v1/videos/{task_id}` every 5-10s
          until `status=completed`.

          Typical generation time: 30s - 3min depending on model and length.

          ## Cost

          Each `n` count is a separate task. A request with `n: 4` and
          `seconds: "10"` generates 4 × 10-second videos.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/video-creation-request'
            examples:
              seedance_text:
                summary: Seedance 2.0 — text-to-video
                value:
                  model: seedance-2.0
                  prompt: A cat playing piano in a jazz club, smoke, warm lighting, cinematic
                  size: 1280x720
                  seconds: '5'
              seedance_i2v:
                summary: Seedance 2.0 — image-to-video
                value:
                  model: seedance-2.0
                  prompt: The character walks forward, then waves at the camera
                  ref_images:
                    - https://example.com/character-reference.png
                  size: 1280x720
                  seconds: '5'
              veo_fast:
                summary: Veo 3.1 fast with audio
                value:
                  model: veo_3_1-fast
                  prompt: Ocean waves crashing on rocks at sunset, with seagulls crying
                  size: 1280x720
                  seconds: '8'
                  metadata:
                    audio: true
              veo_pro:
                summary: Veo 3.1 pro — 4K with audio
                value:
                  model: veo_3_1-pro
                  prompt: A futuristic city skyline at night, neon lights reflecting on wet streets
                  size: 1920x1080
                  seconds: '8'
                  metadata:
                    audio: true
                    style: cinematic
                    camera: pan_right
              sora_2_long:
                summary: Sora 2 — long-form cinematic
                value:
                  model: sora-2
                  prompt: |
                    A detective walks through a rainy 1940s city street, camera follows
                    from behind, neon signs reflect in puddles, jazz music plays from
                    a nearby club. Cinematic, noir, 35mm film grain.
                  size: 1920x1080
                  seconds: '15'
                  seed: 12345
                  metadata:
                    style: noir
                    quality_level: high
              kling_character:
                summary: Kling — character consistency
                value:
                  model: kling-1.6-pro
                  prompt: The character dances happily in a field of flowers
                  ref_images:
                    - https://example.com/character-front.png
                    - https://example.com/character-side.png
                  size: 1280x720
                  seconds: '10'
                  metadata:
                    negative_prompt: blurry, distorted, extra limbs
      responses:
        '200':
          description: |
            Task created. Status will be `queued` or `in_progress`. Poll
            `GET /v1/videos/{task_id}` for updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/video-task'
              example:
                id: video_abc123def456
                object: video
                model: seedance-2.0
                status: queued
                progress: 0
                created_at: 1700000000
                seconds: '5'
                size: 1280x720
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
  /v1/videos/{task_id}:
    get:
      tags:
        - videos
      summary: Get video task status
      description: |
        Retrieve the current status of a video generation task. Poll this
        endpoint until `status=completed`, or use a webhook to be notified
        automatically.
      operationId: getVideoTask
      x-mint:
        metadata:
          title: Get video status
          sidebarTitle: Get video status
          description: Poll for the status of a video generation task
      parameters:
        - name: task_id
          in: path
          required: true
          description: The video task ID returned from `POST /v1/videos`
          schema:
            type: string
            example: video_abc123def456
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/video-task'
              examples:
                queued:
                  summary: Task just submitted
                  value:
                    id: video_abc123def456
                    object: video
                    model: seedance-2.0
                    status: queued
                    progress: 0
                    created_at: 1700000000
                    seconds: '5'
                    size: 1280x720
                in_progress:
                  summary: Mid-generation
                  value:
                    id: video_abc123def456
                    object: video
                    model: seedance-2.0
                    status: in_progress
                    progress: 45
                    created_at: 1700000000
                    seconds: '5'
                    size: 1280x720
                completed:
                  summary: Done — URL available until expires_at
                  value:
                    id: video_abc123def456
                    object: video
                    model: seedance-2.0
                    status: completed
                    progress: 100
                    created_at: 1700000000
                    completed_at: 1700000120
                    expires_at: 1700003720
                    seconds: '5'
                    size: 1280x720
                    url: https://cdn.infinityblue.com/videos/abc123.mp4
                failed:
                  summary: Generation failed
                  value:
                    id: video_abc123def456
                    object: video
                    model: seedance-2.0
                    status: failed
                    progress: 30
                    created_at: 1700000000
                    seconds: '5'
                    size: 1280x720
                    error:
                      code: content_policy_violation
                      message: Prompt was blocked by content filter
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '429':
          $ref: '#/components/responses/rate-limited'
  /v1/videos/{task_id}/content:
    get:
      tags:
        - videos
      summary: Download video content
      description: |
        Download the generated video file as binary content (MP4).
        For permanent storage, download and re-host — the `url` field
        in the task object expires at `expires_at`.
      operationId: getVideoContent
      x-mint:
        metadata:
          title: Download video
          sidebarTitle: Download video
          description: Stream the generated video as MP4 bytes
      parameters:
        - name: task_id
          in: path
          required: true
          description: The completed video task ID
          schema:
            type: string
      responses:
        '200':
          description: Video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          description: |
            Task not found OR task is not yet completed. If `status` is
            not `completed`, this returns 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '410':
          description: |
            Video content has expired and is no longer available.
            You will need to regenerate the video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          $ref: '#/components/responses/rate-limited'
