description: |
  Malformed request: invalid JSON, missing required fields, invalid
  parameter values, or model rejected the request.
  Do not retry without changing the request.
content:
  application/json:
    schema:
      $ref: ../schemas/error.yaml
    example:
      error:
        message: "Invalid value for 'temperature': must be between 0 and 2"
        type: invalid_request_error
        code: invalid_parameter
        param: temperature
