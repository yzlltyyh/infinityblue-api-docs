type: object
required: [type, input_audio]
properties:
  type:
    type: string
    enum: [input_audio]
  input_audio:
    type: object
    required: [data, format]
    properties:
      data:
        type: string
        description: Base64-encoded audio data.
      format:
        type: string
        enum: [wav, mp3]
        description: Audio container format.
