type: object
required: [model, prompt]
properties:
  model:
    type: string
    description: |
      Model to use. Common values:
      - `gpt-image-1` — OpenAI's latest, supports editing and best quality
      - `dall-e-3` — OpenAI DALL-E 3 (high quality, slower)
      - `flux-pro-1.1` — Black Forest Labs
      - `qwen-image` — Alibaba (best for Chinese text in images)
      - `sd-3.5-large` — Stability AI
    example: gpt-image-1
  prompt:
    type: string
    minLength: 1
    description: |
      Text description of the desired image. Be specific about subject,
      style, lighting, composition, and any text that should appear.
    example: A serene mountain landscape at sunset, oil painting style
  n:
    type: integer
    minimum: 1
    maximum: 10
    default: 1
    description: How many images to generate
  size:
    type: string
    description: |
      Output image size. Format: `WxH` in pixels.
      - `1024x1024` (square, default)
      - `1024x1536` (portrait)
      - `1536x1024` (landscape)
      - `auto` (model decides; gpt-image-1 only)
    enum:
      - 1024x1024
      - 1024x1536
      - 1536x1024
      - auto
    default: 1024x1024
  quality:
    type: string
    description: |
      Rendering quality. `hd` is slower and more expensive.
      For gpt-image-1, use `low`/`medium`/`high`/`auto`.
    enum: [standard, hd, low, medium, high, auto]
    default: standard
  style:
    type: string
    enum: [vivid, natural]
    default: vivid
    description: |
      DALL-E 3 only. `vivid` (default) is more hyper-real and dramatic.
      `natural` is more subdued.
  response_format:
    type: string
    enum: [url, b64_json]
    default: url
    description: |
      How the generated image is returned:
      - `url`: temporary URL (expires in 60 minutes)
      - `b64_json`: base64-encoded PNG bytes
  output_format:
    type: string
    enum: [png, jpeg, webp]
    default: png
    description: gpt-image-1 only. Output image format.
  output_compression:
    type: integer
    minimum: 0
    maximum: 100
    default: 100
    description: |
      gpt-image-1 only. Compression level for JPEG/WebP outputs (0-100).
  background:
    type: string
    enum: [transparent, opaque, auto]
    default: auto
    description: |
      gpt-image-1 only. `transparent` produces PNG with alpha channel.
  moderation:
    type: string
    enum: [auto, low]
    default: auto
    description: |
      gpt-image-1 only. Content moderation strictness.
  user:
    type: string
    description: Unique end-user identifier (for abuse detection)
    example: user-1234
