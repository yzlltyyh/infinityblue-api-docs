type: object
required: [type, function]
properties:
  type:
    type: string
    enum: [function]
  function:
    type: object
    required: [name]
    properties:
      name:
        type: string
        description: Function name
        example: get_weather
      description:
        type: string
        description: |
          What the function does. The model uses this to decide when to
          call the function. Be specific and clear.
      parameters:
        type: object
        description: |
          JSON Schema describing the function arguments.
        example:
          type: object
          properties:
            location:
              type: string
              description: City name
          required: [location]
      strict:
        type: boolean
        default: false
        description: |
          When true, enforces strict schema adherence (no extra properties,
          all required fields present).
