post:
  tags: [chat, images]
  summary: Generate content (Gemini format)
  description: |
    Native Google Gemini format. The response format and
    multimodal capabilities depend on the model:

    | Model | Text | Image | Audio | Video |
    |---|---|---|---|---|
    | `gemini-2.5-pro` | ✅ | ✅ | ✅ | ✅ |
    | `gemini-2.0-flash` | ✅ | ✅ | ✅ | ✅ |
    | `gemini-2.5-flash-image` (Nano Banana) | ✅ | ✅ out | — | — |

    For pure text chat, prefer `/v1/chat/completions`.
  operationId: geminiGenerateContent
  x-mint:
    metadata:
      title: Generate content (Gemini)
      sidebarTitle: Generate content (Gemini)
      description: Native Gemini generateContent — supports text, image, audio, video
  parameters:
    - name: model
      in: path
      description: Model ID (e.g. `gemini-2.5-pro`, `gemini-2.0-flash`)
      schema:
        type: string
        example: gemini-2.5-pro
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [contents]
          properties:
            contents:
              type: array
              description: |
                Conversation contents. Each turn has `role` (`user` or
                `model`) and `parts` (an array of typed parts).
              items:
                type: object
                required: [role, parts]
                properties:
                  role:
                    type: string
                    enum: [user, model]
                  parts:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          properties:
                            text: { type: string }
                        - type: object
                          properties:
                            inline_data:
                              type: object
                              properties:
                                mime_type: { type: string, example: image/jpeg }
                                data: { type: string, description: Base64-encoded }
                        - type: object
                          properties:
                            file_data:
                              type: object
                              properties:
                                mime_type: { type: string }
                                file_uri: { type: string, format: uri }
            systemInstruction:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      text: { type: string }
            generationConfig:
              type: object
              description: |
                Model configuration. For image generation, include
                `responseModalities: ["IMAGE"]` and `imageConfig`.
              properties:
                temperature: { type: number, minimum: 0, maximum: 2 }
                topP: { type: number, minimum: 0, maximum: 1 }
                topK: { type: integer }
                maxOutputTokens: { type: integer }
                stopSequences:
                  type: array
                  items: { type: string }
                responseMimeType:
                  type: string
                  enum: [text/plain, application/json]
                responseSchema:
                  type: object
                  description: JSON Schema for structured output
                responseModalities:
                  type: array
                  items:
                    type: string
                    enum: [TEXT, IMAGE]
                  description: |
                    For image generation, set to `["IMAGE"]` or
                    `["TEXT", "IMAGE"]` for text+image.
                imageConfig:
                  type: object
                  description: Image generation config (for Nano Banana etc.)
                  properties:
                    aspectRatio:
                      type: string
                      enum: ["1:1", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "21:9"]
                    imageSize:
                      type: string
                      enum: [1K, 2K, 4K]
            safetySettings:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    enum:
                      - HARM_CATEGORY_HARASSMENT
                      - HARM_CATEGORY_HATE_SPEECH
                      - HARM_CATEGORY_SEXUALLY_EXPLICIT
                      - HARM_CATEGORY_DANGEROUS_CONTENT
                  threshold:
                    type: string
                    enum: [BLOCK_NONE, BLOCK_LOW_AND_ABOVE, BLOCK_MEDIUM_AND_ABOVE, BLOCK_ONLY_HIGH]
        examples:
          text_chat:
            value:
              contents:
                - role: user
                  parts:
                    - text: Explain quantum entanglement in one paragraph.
          with_image:
            value:
              contents:
                - role: user
                  parts:
                    - text: What's in this image?
                    - inline_data:
                        mime_type: image/jpeg
                        data: /9j/4AAQSkZJRgABAQAA...
          image_generation:
            summary: Nano Banana image generation
            value:
              contents:
                - role: user
                  parts:
                    - text: A futuristic city at sunset
              generationConfig:
                responseModalities: [IMAGE]
                imageConfig:
                  aspectRatio: "16:9"
                  imageSize: "2K"
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    content:
                      type: object
                      properties:
                        role: { type: string, enum: [model] }
                        parts:
                          type: array
                          items:
                            oneOf:
                              - type: object
                                properties: { text: { type: string } }
                              - type: object
                                properties:
                                  inline_data:
                                    type: object
                                    properties:
                                      mime_type: { type: string }
                                      data: { type: string, description: Base64-encoded image }
                    finishReason:
                      type: string
                      enum: [STOP, MAX_TOKENS, SAFETY, RECITATION, OTHER]
                    safetyRatings:
                      type: array
                      items:
                        type: object
                        properties:
                          category: { type: string }
                          probability: { type: string, enum: [NEGLIGIBLE, LOW, MEDIUM, HIGH] }
              usageMetadata:
                type: object
                properties:
                  promptTokenCount: { type: integer }
                  candidatesTokenCount: { type: integer }
                  totalTokenCount: { type: integer }
                  cachedContentTokenCount: { type: integer }
    "400":
      $ref: ../components/responses/bad-request.yaml
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
    "500":
      $ref: ../components/responses/server-error.yaml
