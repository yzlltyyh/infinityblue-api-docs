post:
  tags: [images]
  summary: Edit image (OpenAI format)
  description: |
    Edit or extend images using a prompt and optional mask.
    OpenAI Images-compatible.

    **Send as `multipart/form-data`**, not JSON.
  operationId: editImage
  x-mint:
    metadata:
      title: Edit images
      sidebarTitle: Edit images
      description: Inpaint, outpaint, and multi-image edits
  requestBody:
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/image-edit-request.yaml
        encoding:
          image:
            contentType: image/png, image/jpeg, image/webp
          mask:
            contentType: image/png
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/image-generation-response.yaml
    "400":
      $ref: ../components/responses/bad-request.yaml
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "413":
      description: |
        Image too large. Max size is 4MB for `image` and 4MB for `mask`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
    "500":
      $ref: ../components/responses/server-error.yaml
