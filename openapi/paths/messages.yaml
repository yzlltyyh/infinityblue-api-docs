post:
  tags: [chat]
  summary: Create message (Anthropic Messages format)
  description: |
    Native Anthropic Messages API format. Use this when you want full
    access to Anthropic-specific features:
    - Prompt caching (explicit cache breakpoints)
    - Extended thinking with budget control
    - PDF input
    - Citations
    - Computer use (beta)

    For general cross-model chat, use `/v1/chat/completions` instead.
  operationId: createMessage
  x-mint:
    metadata:
      title: Messages (Anthropic)
      sidebarTitle: Messages (Anthropic)
      description: Native Anthropic Messages API — full feature access
    content: |
      ## Extended thinking

      Add `"thinking": {"type": "enabled", "budget_tokens": 5000}` to enable
      chain-of-thought. The response will include a `thinking` content block
      alongside the `text` block.

      ## Prompt caching

      Mark cache breakpoints with `"cache_control": {"type": "ephemeral"}`
      on a content block. Subsequent requests with the same prefix get
      up to 90% discount on cached tokens.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [model, max_tokens, messages]
          properties:
            model:
              type: string
              example: claude-sonnet-4-6
            max_tokens:
              type: integer
              minimum: 1
              description: |
                Maximum tokens to generate. **Required** in Messages API
                (unlike Chat Completions where it is optional).
            messages:
              type: array
              minItems: 1
              items:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [user, assistant]
                  content:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: object
                          required: [type]
                          properties:
                            type:
                              type: string
                              enum: [text, image, document, tool_use, tool_result, thinking]
            system:
              type: string
              description: |
                System prompt. Equivalent to a `system` message in
                Chat Completions.
            temperature:
              type: number
              minimum: 0
              maximum: 1
              default: 1
            top_p:
              type: number
              minimum: 0
              maximum: 1
            top_k:
              type: integer
              minimum: 0
              description: |
                Sample from the top K options at each step. Lower = more focused.
            stop_sequences:
              type: array
              items: { type: string }
            stream:
              type: boolean
              default: false
            thinking:
              type: object
              properties:
                type: { type: string, enum: [enabled, disabled] }
                budget_tokens: { type: integer, minimum: 1024 }
            tools:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  input_schema: { type: object }
            tool_choice:
              type: object
              properties:
                type: { type: string, enum: [auto, any, tool, none] }
                name: { type: string }
            metadata:
              type: object
              properties:
                user_id: { type: string, description: "Unique end-user ID for abuse detection" }
        examples:
          basic:
            value:
              model: claude-sonnet-4-6
              max_tokens: 1024
              messages:
                - role: user
                  content: Hello!
          with_thinking:
            summary: Extended thinking
            value:
              model: claude-sonnet-4-6
              max_tokens: 8000
              thinking:
                type: enabled
                budget_tokens: 5000
              messages:
                - role: user
                  content: 'Solve: x^2 - 4x + 3 = 0'
          with_cache:
            summary: Prompt caching
            value:
              model: claude-sonnet-4-6
              max_tokens: 1024
              system: |
                You are an expert legal analyst. [long system prompt]
                <cache_break>
              messages:
                - role: user
                  content: Summarize contract #12345
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, example: msg_abc123 }
              type: { type: string, enum: [message] }
              role: { type: string, enum: [assistant] }
              content:
                type: array
                items:
                  type: object
                  required: [type]
                  properties:
                    type: { type: string, enum: [text, thinking, tool_use] }
                    text: { type: string }
                    thinking: { type: string }
                    id: { type: string, description: "For tool_use blocks" }
                    name: { type: string }
                    input: { type: object }
              model: { type: string }
              stop_reason:
                type: string
                enum: [end_turn, max_tokens, stop_sequence, tool_use]
              usage:
                type: object
                properties:
                  input_tokens: { type: integer }
                  output_tokens: { type: integer }
                  cache_creation_input_tokens: { type: integer, description: "Tokens written to cache" }
                  cache_read_input_tokens: { type: integer, description: "Tokens served from cache" }
    "400":
      $ref: ../components/responses/bad-request.yaml
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
    "500":
      $ref: ../components/responses/server-error.yaml
