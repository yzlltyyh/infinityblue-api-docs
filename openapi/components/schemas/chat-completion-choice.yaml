type: object
required: [index, message, finish_reason]
properties:
  index:
    type: integer
    description: Choice index (when `n > 1`)
  message:
    type: object
    description: |
      The assistant's reply. Multimodal content may be present in
      `content` as an array.
    required: [role, content]
    properties:
      role:
        type: string
        enum: [assistant]
      content:
        type: string
        description: Generated text (or null if tool_calls present)
      reasoning_content:
        type: string
        description: |
          Reasoning/thinking tokens (for o-series, Claude thinking, Gemini thinking).
          Shown separately from `content` so the UI can collapse it.
      tool_calls:
        type: array
        items:
          $ref: ./tool-call.yaml
  finish_reason:
    type: string
    enum: [stop, length, tool_calls, content_filter, function_call]
    description: |
      Why the model stopped generating:
      - `stop`: natural end (hit stop sequence or model decided)
      - `length`: hit `max_tokens` limit
      - `tool_calls`: model wants to call a function
      - `content_filter`: content was blocked
