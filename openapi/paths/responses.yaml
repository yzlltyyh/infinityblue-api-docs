post:
  tags: [chat]
  summary: Create response (OpenAI Responses format)
  description: |
    OpenAI Responses API format. Recommended for new applications
    that need built-in tool use (web search, file search, code interpreter)
    and stateful conversations.

    For most chat use cases, `/v1/chat/completions` is sufficient.
  operationId: createResponse
  x-mint:
    metadata:
      title: Responses
      sidebarTitle: Responses (OpenAI format)
      description: OpenAI Responses API — built-in tools and stateful conversations
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [model, input]
          properties:
            model:
              type: string
              example: gpt-5
            input:
              type: array
              description: |
                List of input items. Can be plain text strings or
                structured items (messages, tool results, function calls).
              items:
                oneOf:
                  - type: string
                  - type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant, system, developer]
                      content:
                        type: string
            instructions:
              type: string
              description: |
                System-level instructions. Equivalent to a `system` message
                at the start of `input`.
            previous_response_id:
              type: string
              description: |
                Chain to a previous response. When set, the model sees
                the full conversation history of the previous response.
                Use this for stateful multi-turn without resending all
                messages.
            tools:
              type: array
              items:
                type: object
                required: [type]
                properties:
                  type:
                    type: string
                    enum: [web_search, file_search, function, code_interpreter]
                  # Additional properties depend on `type`
            stream:
              type: boolean
              default: false
            temperature:
              type: number
              minimum: 0
              maximum: 2
              default: 1
            max_output_tokens:
              type: integer
              minimum: 1
            user:
              type: string
        examples:
          basic:
            value:
              model: gpt-5
              input: "What's the capital of France?"
          stateful:
            summary: Stateful multi-turn via previous_response_id
            value:
              model: gpt-5
              previous_response_id: resp_abc123
              input: "Now translate that to Japanese"
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, example: resp_abc123 }
              object: { type: string, enum: [response] }
              created_at: { type: integer }
              model: { type: string }
              status:
                type: string
                enum: [completed, failed, in_progress, cancelled]
              output:
                type: array
                items:
                  type: object
              usage: { $ref: ../components/schemas/usage.yaml }
    "400":
      $ref: ../components/responses/bad-request.yaml
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
    "500":
      $ref: ../components/responses/server-error.yaml
