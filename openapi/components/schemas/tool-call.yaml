type: object
required: [id, type, function]
properties:
  id:
    type: string
    description: Unique tool call ID
    example: call_abc123
  type:
    type: string
    enum: [function]
  function:
    type: object
    required: [name, arguments]
    properties:
      name:
        type: string
        description: Name of the function to call
        example: get_weather
      arguments:
        type: string
        description: |
          JSON-encoded arguments for the function. Must be valid JSON
          matching the function's `parameters` schema.
        example: '{"location": "Paris"}'
