type: object
description: |
  Represents a video generation task. Tasks are async — submit a
  request to create one, then poll `GET /v1/videos/{task_id}` or
  register a webhook to receive completion.

  Status lifecycle:
  ```
  queued → in_progress → completed
                      ↘ failed
                      ↘ cancelled
  ```
required: [id, object, model, status, progress, created_at]
properties:
  id:
    type: string
    description: Unique video task ID
    example: video_abc123def456
  object:
    type: string
    enum: [video]
  model:
    type: string
    description: |
      The model used. Examples:
      - `seedance-2.0` (ByteDance Seedance)
      - `veo_3_1-fast`, `veo_3_1-pro` (Google Veo)
      - `sora-2`, `sora-2-pro` (OpenAI Sora)
    example: seedance-2.0
  status:
    type: string
    enum: [queued, in_progress, completed, failed, cancelled]
    description: Current task state
  progress:
    type: integer
    minimum: 0
    maximum: 100
    description: Generation progress percentage (0-100)
    example: 45
  created_at:
    type: integer
    description: Unix timestamp (seconds) when the task was created
    example: 1700000000
  completed_at:
    type: [integer, "null"]
    description: Unix timestamp when the task completed (null if not done)
  expires_at:
    type: [integer, "null"]
    description: |
      Unix timestamp when the video content URL expires. After this,
      you must re-fetch via `GET /v1/videos/{id}/content`.
  seconds:
    type: string
    description: Duration of the generated video (e.g. "5", "8", "10")
    example: "5"
  size:
    type: string
    description: Resolution in `WxH` format
    example: 1280x720
  url:
    type: string
    format: uri
    description: |
      Direct URL to the video file. Only present when `status=completed`.
      Expires at `expires_at`. For permanent storage, download via
      `GET /v1/videos/{id}/content`.
  error:
    type: object
    description: |
      Error details. Only present when `status=failed`.
    properties:
      code:
        type: string
        example: content_policy_violation
      message:
        type: string
        example: Prompt was blocked by content filter
  metadata:
    type: object
    additionalProperties: true
    description: |
      Additional model-specific data (e.g. `seed`, `negative_prompt`,
      `style`). Model-dependent.
