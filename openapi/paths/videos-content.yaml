get:
  tags: [videos]
  summary: Download video content
  description: |
    Download the generated video file as binary content (MP4).
    For permanent storage, download and re-host — the `url` field
    in the task object expires at `expires_at`.
  operationId: getVideoContent
  x-mint:
    metadata:
      title: Download video
      sidebarTitle: Download video
      description: Stream the generated video as MP4 bytes
  parameters:
    - name: task_id
      in: path
      description: The completed video task ID
      schema:
        type: string
  responses:
    "200":
      description: Video file
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    "401":
      $ref: ../components/responses/unauthorized.yaml
    "404":
      description: |
        Task not found OR task is not yet completed. If `status` is
        not `completed`, this returns 404.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
    "410":
      description: |
        Video content has expired and is no longer available.
        You will need to regenerate the video.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
    "429":
      $ref: ../components/responses/rate-limited.yaml
