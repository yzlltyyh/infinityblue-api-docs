  /v1beta/models/{model}:generateContent:
    post:
      tags:
        - chat
        - images
      summary: Generate content (Gemini format)
      description: |
        Native Google Gemini format. The response format and
        multimodal capabilities depend on the model:

        | Model | Text | Image | Audio | Video |
        |---|---|---|---|---|
        | `gemini-2.5-pro` | ✅ | ✅ | ✅ | ✅ |
        | `gemini-2.0-flash` | ✅ | ✅ | ✅ | ✅ |
        | `gemini-2.5-flash-image` (Nano Banana) | ✅ | ✅ out | — | — |

        For pure text chat, prefer `/v1/chat/completions`.
      operationId: geminiGenerateContent
      x-mint:
        metadata:
          title: Generate content (Gemini)
          sidebarTitle: Generate content (Gemini)
          description: Native Gemini generateContent — supports text, image, audio, video
      parameters:
        - name: model
          in: path
          required: true
          description: Model ID (e.g. `gemini-2.5-pro`, `gemini-2.0-flash`)
          schema:
            type: string
            example: gemini-2.5-pro
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - contents
              properties:
                contents:
                  type: array
                  description: |
                    Conversation contents. Each turn has `role` (`user` or
                    `model`) and `parts` (an array of typed parts).
                  items:
                    type: object
                    required:
                      - role
                      - parts
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - model
                      parts:
                        type: array
                        items:
                          oneOf:
                            - type: object
                              properties:
                                text:
                                  type: string
                            - type: object
                              properties:
                                inline_data:
                                  type: object
                                  properties:
                                    mime_type:
                                      type: string
                                      example: image/jpeg
                                    data:
                                      type: string
                                      description: Base64-encoded
                            - type: object
                              properties:
                                file_data:
                                  type: object
                                  properties:
                                    mime_type:
                                      type: string
                                    file_uri:
                                      type: string
                                      format: uri
                systemInstruction:
                  type: object
                  properties:
                    parts:
                      type: array
                      items:
                        type: object
                        properties:
                          text:
                            type: string
                generationConfig:
                  type: object
                  description: |
                    Model configuration. For image generation, include
                    `responseModalities: ["IMAGE"]` and `imageConfig`.
                  properties:
                    temperature:
                      type: number
                      minimum: 0
                      maximum: 2
                    topP:
                      type: number
                      minimum: 0
                      maximum: 1
                    topK:
                      type: integer
                    maxOutputTokens:
                      type: integer
                    stopSequences:
                      type: array
                      items:
                        type: string
                    responseMimeType:
                      type: string
                      enum:
                        - text/plain
                        - application/json
                    responseSchema:
                      type: object
                      description: JSON Schema for structured output
                    responseModalities:
                      type: array
                      items:
                        type: string
                        enum:
                          - TEXT
                          - IMAGE
                      description: |
                        For image generation, set to `["IMAGE"]` or
                        `["TEXT", "IMAGE"]` for text+image.
                    imageConfig:
                      type: object
                      description: Image generation config (for Nano Banana etc.)
                      properties:
                        aspectRatio:
                          type: string
                          enum:
                            - '1:1'
                            - '2:3'
                            - '3:2'
                            - '3:4'
                            - '4:3'
                            - '9:16'
                            - '16:9'
                            - '21:9'
                        imageSize:
                          type: string
                          enum:
                            - 1K
                            - 2K
                            - 4K
                safetySettings:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        type: string
                        enum:
                          - HARM_CATEGORY_HARASSMENT
                          - HARM_CATEGORY_HATE_SPEECH
                          - HARM_CATEGORY_SEXUALLY_EXPLICIT
                          - HARM_CATEGORY_DANGEROUS_CONTENT
                      threshold:
                        type: string
                        enum:
                          - BLOCK_NONE
                          - BLOCK_LOW_AND_ABOVE
                          - BLOCK_MEDIUM_AND_ABOVE
                          - BLOCK_ONLY_HIGH
            examples:
              text_chat:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: Explain quantum entanglement in one paragraph.
              with_image:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: What's in this image?
                        - inline_data:
                            mime_type: image/jpeg
                            data: /9j/4AAQSkZJRgABAQAA...
              image_generation:
                summary: Nano Banana image generation
                value:
                  contents:
                    - role: user
                      parts:
                        - text: A futuristic city at sunset
                  generationConfig:
                    responseModalities:
                      - IMAGE
                    imageConfig:
                      aspectRatio: '16:9'
                      imageSize: 2K
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: object
                          properties:
                            role:
                              type: string
                              enum:
                                - model
                            parts:
                              type: array
                              items:
                                oneOf:
                                  - type: object
                                    properties:
                                      text:
                                        type: string
                                  - type: object
                                    properties:
                                      inline_data:
                                        type: object
                                        properties:
                                          mime_type:
                                            type: string
                                          data:
                                            type: string
                                            description: Base64-encoded image
                        finishReason:
                          type: string
                          enum:
                            - STOP
                            - MAX_TOKENS
                            - SAFETY
                            - RECITATION
                            - OTHER
                        safetyRatings:
                          type: array
                          items:
                            type: object
                            properties:
                              category:
                                type: string
                              probability:
                                type: string
                                enum:
                                  - NEGLIGIBLE
                                  - LOW
                                  - MEDIUM
                                  - HIGH
                  usageMetadata:
                    type: object
                    properties:
                      promptTokenCount:
                        type: integer
                      candidatesTokenCount:
                        type: integer
                      totalTokenCount:
                        type: integer
                      cachedContentTokenCount:
                        type: integer
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rate-limited'
        '500':
          $ref: '#/components/responses/server-error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        Pass your API key as a Bearer token:
        `Authorization: Bearer YOUR_API_KEY`
  schemas:
    Error:
      $ref: '#/components/schemas/error'
    ChatMessage:
      $ref: '#/components/schemas/chat-message'
    ToolCall:
      $ref: '#/components/schemas/tool-call'
    Tool:
      $ref: '#/components/schemas/tool'
    Usage:
      $ref: '#/components/schemas/usage'
    ModelInfo:
      $ref: '#/components/schemas/model-info'
    ChatCompletionRequest:
      $ref: '#/components/schemas/chat-completion-request'
    ChatCompletionResponse:
      $ref: '#/components/schemas/chat-completion-response'
    ChatCompletionChoice:
      $ref: '#/components/schemas/chat-completion-choice'
    ContentPartText:
      $ref: '#/components/schemas/content-part-text'
    ContentPartImage:
      $ref: '#/components/schemas/content-part-image'
    ContentPartAudio:
      $ref: '#/components/schemas/content-part-audio'
    ResponseFormatText:
      $ref: '#/components/schemas/response-format-text'
    ResponseFormatJsonObject:
      $ref: '#/components/schemas/response-format-json-object'
    ResponseFormatJsonSchema:
      $ref: '#/components/schemas/response-format-json-schema'
    ImageGenerationRequest:
      $ref: '#/components/schemas/image-generation-request'
    ImageGenerationResponse:
      $ref: '#/components/schemas/image-generation-response'
    ImageEditRequest:
      $ref: '#/components/schemas/image-edit-request'
    VideoTask:
      $ref: '#/components/schemas/video-task'
    VideoCreationRequest:
      $ref: '#/components/schemas/video-creation-request'
    model-info:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          description: Model identifier (used in the `model` parameter of requests)
          example: gpt-4o
        object:
          type: string
          enum:
            - model
        created:
          type: integer
          description: Unix timestamp of when the model was added
          example: 1700000000
        owned_by:
          type: string
          description: Organization that owns/created the model
          example: openai
    error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
          properties:
            message:
              type: string
              description: Human-readable error description.
              example: Invalid API key
            type:
              type: string
              description: |
                Error category. One of:
                - `invalid_request_error` (400)
                - `authentication_error` (401)
                - `permission_error` (403)
                - `not_found_error` (404)
                - `rate_limit_error` (429)
                - `server_error` (500+)
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - server_error
            code:
              type:
                - string
                - 'null'
              description: Machine-readable error code.
              example: invalid_api_key
            param:
              type:
                - string
                - 'null'
              description: Parameter that caused the error (if applicable).
              example: model
    content-part-text:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
          description: Text content
          example: What is in this image?
    content-part-image:
      type: object
      required:
        - type
        - image_url
      properties:
        type:
          type: string
          enum:
            - image_url
        image_url:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              description: |
                Image URL or `data:image/jpeg;base64,...` data URI.
              example: https://example.com/cat.jpg
            detail:
              type: string
              enum:
                - auto
                - low
                - high
              default: auto
              description: |
                Processing detail level. `low` uses 512×512 thumbnail (cheap),
                `high` does detailed analysis (expensive), `auto` lets the
                model decide.
    content-part-audio:
      type: object
      required:
        - type
        - input_audio
      properties:
        type:
          type: string
          enum:
            - input_audio
        input_audio:
          type: object
          required:
            - data
            - format
          properties:
            data:
              type: string
              description: Base64-encoded audio data.
            format:
              type: string
              enum:
                - wav
                - mp3
              description: Audio container format.
    tool-call:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: Unique tool call ID
          example: call_abc123
        type:
          type: string
          enum:
            - function
        function:
          type: object
          required:
            - name
            - arguments
          properties:
            name:
              type: string
              description: Name of the function to call
              example: get_weather
            arguments:
              type: string
              description: |
                JSON-encoded arguments for the function. Must be valid JSON
                matching the function's `parameters` schema.
              example: '{"location": "Paris"}'
    chat-message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
            - developer
          description: |
            The role of the message author.
            - `system`: top-level instructions (highest priority for most models)
            - `developer`: alias of system in newer OpenAI models
            - `user`: end-user input
            - `assistant`: prior model output
            - `tool`: tool/function result
        content:
          description: |
            Message content. Can be plain text (string) or an array of multimodal
            parts (text + image_url + input_audio).
          oneOf:
            - type: string
              example: Hello, how are you?
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/content-part-text'
                  - $ref: '#/components/schemas/content-part-image'
                  - $ref: '#/components/schemas/content-part-audio'
        name:
          type: string
          description: |
            Optional name of the author. Used to identify participants in
            multi-user conversations or to label tool results.
        tool_call_id:
          type: string
          description: |
            Required when `role` is `tool`. The ID of the tool call this
            message is responding to.
          example: call_abc123
        tool_calls:
          type: array
          description: |
            Present on `assistant` messages when the model wants to call tools.
          items:
            $ref: '#/components/schemas/tool-call'
    tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Function name
              example: get_weather
            description:
              type: string
              description: |
                What the function does. The model uses this to decide when to
                call the function. Be specific and clear.
            parameters:
              type: object
              description: |
                JSON Schema describing the function arguments.
              example:
                type: object
                properties:
                  location:
                    type: string
                    description: City name
                required:
                  - location
            strict:
              type: boolean
              default: false
              description: |
                When true, enforces strict schema adherence (no extra properties,
                all required fields present).
    response-format-text:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
    response-format-json-object:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - json_object
    response-format-json-schema:
      type: object
      required:
        - type
        - json_schema
      properties:
        type:
          type: string
          enum:
            - json_schema
        json_schema:
          type: object
          required:
            - name
            - schema
          properties:
            name:
              type: string
              description: Schema name (used in error messages)
            description:
              type: string
              description: What the output represents
            schema:
              type: object
              description: |
                The JSON Schema the model should conform to.
                Supports standard JSON Schema 2020-12 features.
            strict:
              type: boolean
              default: true
              description: |
                When true, the model output is guaranteed to validate against the schema.
    chat-completion-request:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            ID of the model to use. See `/v1/models` for available models.
            Common values: `gpt-4o`, `gpt-4o-mini`, `claude-3-5-sonnet-latest`,
            `claude-sonnet-4-6`, `gemini-2.0-flash`, `gemini-2.5-pro`.
          example: gpt-4o
        messages:
          type: array
          minItems: 1
          description: |
            A list of messages comprising the conversation so far.
            Roles: `system`, `user`, `assistant`, `tool`, `developer`.
          items:
            $ref: '#/components/schemas/chat-message'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
          description: |
            Sampling temperature. Higher values (e.g. 0.8) make output more random,
            lower values (e.g. 0.2) make it more focused. 0 is deterministic.
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: |
            Nucleus sampling. Consider only tokens with cumulative probability
            ≥ top_p. 0.1 means only the top 10% probable tokens are considered.
        'n':
          type: integer
          minimum: 1
          default: 1
          description: How many chat completion choices to generate for each input.
        max_tokens:
          type: integer
          minimum: 1
          description: |
            Maximum number of tokens to generate in the completion.
            The token count includes visible tokens and reasoning tokens.
        max_completion_tokens:
          type: integer
          minimum: 1
          description: |
            Newer alias for `max_tokens` used in GPT-4o+ models.
        stream:
          type: boolean
          default: false
          description: |
            If true, sends Server-Sent Events with partial message deltas.
            See the streaming guide for details.
        stop:
          description: |
            Up to 4 sequences where the API will stop generating further tokens.
          oneOf:
            - type: string
            - type: array
              maxItems: 4
              items:
                type: string
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
          description: |
            Penalize new tokens based on whether they appear in the text so far.
            Positive values discourage repetition.
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
          description: |
            Penalize new tokens based on their existing frequency in the text.
            Positive values discourage frequent tokens.
        user:
          type: string
          description: |
            A unique identifier for the end-user. Helps with abuse detection
            and per-user rate limits.
          example: user-1234
        tools:
          type: array
          description: |
            List of tools (functions) the model may call. Up to 128 functions.
          items:
            $ref: '#/components/schemas/tool'
        tool_choice:
          description: |
            Controls which (if any) tool is called by the model.
            - `none`: model will not call any tool
            - `auto`: model decides
            - `required`: model must call at least one tool
            - `{"type": "function", "function": {"name": "my_fn"}}`: force a specific tool
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
            - type: object
              required:
                - type
                - function
              properties:
                type:
                  type: string
                  enum:
                    - function
                function:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
        response_format:
          description: |
            Forces the model to produce a specific output structure.
            - `{"type": "text"}`: default
            - `{"type": "json_object"}`: valid JSON
            - `{"type": "json_schema", "json_schema": {...}}`: JSON matching a schema
          oneOf:
            - $ref: '#/components/schemas/response-format-text'
            - $ref: '#/components/schemas/response-format-json-object'
            - $ref: '#/components/schemas/response-format-json-schema'
        seed:
          type: integer
          description: |
            If specified, the system will make a best effort to sample deterministically.
            Same seed + same parameters → similar output.
        reasoning_effort:
          type: string
          enum:
            - low
            - medium
            - high
          description: |
            Constrains effort on reasoning for reasoning models (o-series, Claude thinking,
            Gemini thinking). Higher = more reasoning tokens.
    chat-completion-choice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          description: Choice index (when `n > 1`)
        message:
          type: object
          description: |
            The assistant's reply. Multimodal content may be present in
            `content` as an array.
          required:
            - role
            - content
          properties:
            role:
              type: string
              enum:
                - assistant
            content:
              type: string
              description: Generated text (or null if tool_calls present)
            reasoning_content:
              type: string
              description: |
                Reasoning/thinking tokens (for o-series, Claude thinking, Gemini thinking).
                Shown separately from `content` so the UI can collapse it.
            tool_calls:
              type: array
              items:
                $ref: '#/components/schemas/tool-call'
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - tool_calls
            - content_filter
            - function_call
          description: |
            Why the model stopped generating:
            - `stop`: natural end (hit stop sequence or model decided)
            - `length`: hit `max_tokens` limit
            - `tool_calls`: model wants to call a function
            - `content_filter`: content was blocked
    usage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          description: Tokens in the input
        completion_tokens:
          type: integer
          description: Tokens in the generated output
        total_tokens:
          type: integer
          description: prompt_tokens + completion_tokens
        prompt_tokens_details:
          type: object
          description: |
            Breakdown of input tokens (e.g. cached tokens with discount).
          properties:
            cached_tokens:
              type: integer
              description: Tokens served from cache (often discounted)
        completion_tokens_details:
          type: object
          description: Breakdown of output tokens.
          properties:
            reasoning_tokens:
              type: integer
              description: |
                Reasoning tokens (for o-series, Claude thinking, Gemini thinking).
                Often billed differently than regular output tokens.
    chat-completion-response:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: Unique chat completion ID
          example: chatcmpl-abc123
        object:
          type: string
          enum:
            - chat.completion
        created:
          type: integer
          description: Unix timestamp of when the completion was created
          example: 1700000000
        model:
          type: string
          description: Model used for the completion
          example: gpt-4o-2024-08-06
        choices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/chat-completion-choice'
        usage:
          $ref: '#/components/schemas/usage'
        system_fingerprint:
          type: string
          description: |
            Identifier for the backend configuration. Useful for debugging
            reproducibility issues.
          example: fp_abc123
    image-generation-request:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: |
            Model to use. Common values:
            - `gpt-image-1` — OpenAI's latest, supports editing and best quality
            - `dall-e-3` — OpenAI DALL-E 3 (high quality, slower)
            - `flux-pro-1.1` — Black Forest Labs
            - `qwen-image` — Alibaba (best for Chinese text in images)
            - `sd-3.5-large` — Stability AI
          example: gpt-image-1
        prompt:
          type: string
          minLength: 1
          description: |
            Text description of the desired image. Be specific about subject,
            style, lighting, composition, and any text that should appear.
          example: A serene mountain landscape at sunset, oil painting style
        'n':
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: How many images to generate
        size:
          type: string
          description: |
            Output image size. Format: `WxH` in pixels.
            - `1024x1024` (square, default)
            - `1024x1536` (portrait)
            - `1536x1024` (landscape)
            - `auto` (model decides; gpt-image-1 only)
          enum:
            - 1024x1024
            - 1024x1536
            - 1536x1024
            - auto
          default: 1024x1024
        quality:
          type: string
          description: |
            Rendering quality. `hd` is slower and more expensive.
            For gpt-image-1, use `low`/`medium`/`high`/`auto`.
          enum:
            - standard
            - hd
            - low
            - medium
            - high
            - auto
          default: standard
        style:
          type: string
          enum:
            - vivid
            - natural
          default: vivid
          description: |
            DALL-E 3 only. `vivid` (default) is more hyper-real and dramatic.
            `natural` is more subdued.
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url
          description: |
            How the generated image is returned:
            - `url`: temporary URL (expires in 60 minutes)
            - `b64_json`: base64-encoded PNG bytes
        output_format:
          type: string
          enum:
            - png
            - jpeg
            - webp
          default: png
          description: gpt-image-1 only. Output image format.
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
          description: |
            gpt-image-1 only. Compression level for JPEG/WebP outputs (0-100).
        background:
          type: string
          enum:
            - transparent
            - opaque
            - auto
          default: auto
          description: |
            gpt-image-1 only. `transparent` produces PNG with alpha channel.
        moderation:
          type: string
          enum:
            - auto
            - low
          default: auto
          description: |
            gpt-image-1 only. Content moderation strictness.
        user:
          type: string
          description: Unique end-user identifier (for abuse detection)
          example: user-1234
    image-generation-response:
      type: object
      required:
        - created
        - data
      properties:
        created:
          type: integer
          description: Unix timestamp of when the images were created
          example: 1700000000
        data:
          type: array
          description: Generated images
          items:
            type: object
            required:
              - b64_json
            properties:
              b64_json:
                type: string
                description: |
                  Base64-encoded image. When `response_format=url` is requested
                  on a gpt-image-1 generation, this field contains the data.
              url:
                type: string
                format: uri
                description: |
                  Temporary image URL. Expires in 60 minutes. Download and
                  re-host if you need to keep the image.
              revised_prompt:
                type: string
                description: |
                  DALL-E 3 only. The prompt the model actually used after
                  safety/quality rewrites.
    image-edit-request:
      type: object
      description: |
        Multipart form data request (NOT JSON) for image editing.
        Send with `Content-Type: multipart/form-data`.

        At least one of `image` or `images` must be provided.
      properties:
        image:
          type: string
          format: binary
          description: |
            Single source image (PNG, ≤ 4MB, square). Either this or `images`
            must be provided.
        images:
          type: array
          description: |
            Multiple source images (for gpt-image-1 multi-image edits).
          items:
            type: string
            format: binary
        mask:
          type: string
          format: binary
          description: |
            Optional PNG mask. Transparent areas will be edited; opaque areas
            will be preserved.
        prompt:
          type: string
          description: Text description of the desired edit.
          example: Add a hat on the cat
        model:
          type: string
          description: |
            Model to use. `gpt-image-1` and `dall-e-2` support edits.
          example: gpt-image-1
        'n':
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        size:
          type: string
          enum:
            - 1024x1024
            - 1024x1536
            - 1536x1024
            - auto
          default: 1024x1024
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url
        input_fidelity:
          type: string
          enum:
            - low
            - high
            - auto
          default: high
          description: |
            gpt-image-1 only. How closely to preserve input image features.
            `high` (default) preserves more detail but may be less creative.
        user:
          type: string
          description: Unique end-user identifier
    video-creation-request:
      type: object
      description: |
        Submit a video generation task. The response is a `VideoTask` with
        `status=queued` or `in_progress`. Poll `GET /v1/videos/{id}` or
        register a webhook to receive completion.

        The supported parameters vary by model. Common parameters are listed
        below; model-specific extensions go in `metadata`.
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: |
            Video model to use. Determines which parameters and capabilities
            are available.
            - `seedance-2.0` — ByteDance Seedance 2.0 (5-10s, 720p/1080p)
            - `veo_3_1-fast` — Google Veo 3.1 fast (8s, 720p/1080p)
            - `veo_3_1-pro` — Google Veo 3.1 pro (8s, 4K)
            - `sora-2` — OpenAI Sora 2 (5-20s, 1080p)
            - `kling-1.6-pro` — Kuaishou Kling 1.6 (5-10s, 1080p)
          example: seedance-2.0
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            Text description of the desired video. Describe subject, action,
            camera movement, lighting, and style. Most models support 200-500
            tokens; longer is more expensive.
          example: A cat playing piano in a jazz club, smoke, warm lighting, cinematic
        ref_images:
          type: array
          description: |
            Reference images to guide generation. Use for image-to-video
            (i2v) or character/style consistency.
            Each entry is either a public URL or a `data:image/...;base64,...`
            data URI. Most models support 1-4 reference images.
          items:
            type: string
            format: uri
          example:
            - https://example.com/reference-character.jpg
        size:
          type: string
          description: |
            Output resolution. Format: `WxH`.
            - `seedance-2.0`: 1280x720, 720x1280, 1920x1080, 1080x1920
            - `veo_3_1-fast`: 1280x720, 720x1280, 1920x1080, 1080x1920
            - `sora-2`: 1280x720, 720x1280, 1920x1080, 1080x1920
          example: 1280x720
        seconds:
          type: string
          description: |
            Output duration. Model-dependent:
            - `seedance-2.0`: "5" or "10"
            - `veo_3_1-fast`/`pro`: "8"
            - `sora-2`: "5", "10", "15", "20"
          example: '5'
        seed:
          type: integer
          description: |
            Random seed for reproducibility. Same seed + same prompt + same
            parameters → similar output.
          example: 20231234
        'n':
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: How many videos to generate. Each counts as a separate task.
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url
          description: |
            How the final video is returned in the task object.
        user:
          type: string
          description: Unique end-user identifier (for abuse detection and per-user rate limits)
          example: user-1234
        metadata:
          type: object
          additionalProperties: true
          description: |
            Model-specific extensions. Common fields:
            - `negative_prompt` (string): what to avoid
            - `style` (string): style preset (e.g. "cinematic", "anime")
            - `camera` (string): camera movement (e.g. "zoom_in", "pan_left")
            - `fps` (integer): frames per second
            - `audio` (boolean): include generated audio (Veo 3+)
          example:
            negative_prompt: blurry, low quality, distorted
            style: cinematic
            audio: true
    video-task:
      type: object
      description: |
        Represents a video generation task. Tasks are async — submit a
        request to create one, then poll `GET /v1/videos/{task_id}` or
        register a webhook to receive completion.

        Status lifecycle:
        ```
        queued → in_progress → completed
                            ↘ failed
                            ↘ cancelled
        ```
      required:
        - id
        - object
        - model
        - status
        - progress
        - created_at
      properties:
        id:
          type: string
          description: Unique video task ID
          example: video_abc123def456
        object:
          type: string
          enum:
            - video
        model:
          type: string
          description: |
            The model used. Examples:
            - `seedance-2.0` (ByteDance Seedance)
            - `veo_3_1-fast`, `veo_3_1-pro` (Google Veo)
            - `sora-2`, `sora-2-pro` (OpenAI Sora)
          example: seedance-2.0
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
            - cancelled
          description: Current task state
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Generation progress percentage (0-100)
          example: 45
        created_at:
          type: integer
          description: Unix timestamp (seconds) when the task was created
          example: 1700000000
        completed_at:
          type:
            - integer
            - 'null'
          description: Unix timestamp when the task completed (null if not done)
        expires_at:
          type:
            - integer
            - 'null'
          description: |
            Unix timestamp when the video content URL expires. After this,
            you must re-fetch via `GET /v1/videos/{id}/content`.
        seconds:
          type: string
          description: Duration of the generated video (e.g. "5", "8", "10")
          example: '5'
        size:
          type: string
          description: Resolution in `WxH` format
          example: 1280x720
        url:
          type: string
          format: uri
          description: |
            Direct URL to the video file. Only present when `status=completed`.
            Expires at `expires_at`. For permanent storage, download via
            `GET /v1/videos/{id}/content`.
        error:
          type: object
          description: |
            Error details. Only present when `status=failed`.
          properties:
            code:
              type: string
              example: content_policy_violation
            message:
              type: string
              example: Prompt was blocked by content filter
        metadata:
          type: object
          additionalProperties: true
          description: |
            Additional model-specific data (e.g. `seed`, `negative_prompt`,
            `style`). Model-dependent.
  responses:
    BadRequest:
      $ref: '#/components/responses/bad-request'
    Unauthorized:
      $ref: '#/components/responses/unauthorized'
    Forbidden:
      $ref: '#/components/responses/forbidden'
    NotFound:
      $ref: '#/components/responses/not-found'
    RateLimited:
      $ref: '#/components/responses/rate-limited'
    ServerError:
      $ref: '#/components/responses/server-error'
    ModelList:
      $ref: '#/components/responses/model-list'
    model-list:
      description: List of available models
      content:
        application/json:
          schema:
            type: object
            required:
              - object
              - data
            properties:
              object:
                type: string
                enum:
                  - list
              data:
                type: array
                items:
                  $ref: '#/components/schemas/model-info'
    unauthorized:
      description: |
        Authentication failed. Missing, invalid, or expired API key.
        Check the `Authorization: Bearer ...` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: Invalid API key
              type: authentication_error
              code: invalid_api_key
              param: null
    rate-limited:
      description: |
        Rate limit exceeded. Wait and retry with exponential backoff.
        Default limits: 60 req/min, 500K tokens/min.
        Per-key headers in response:
        - `X-RateLimit-Limit-Requests`
        - `X-RateLimit-Remaining-Requests`
        - `X-RateLimit-Reset-Requests`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: Rate limit reached for requests
              type: rate_limit_error
              code: rate_limit_exceeded
              param: null
    bad-request:
      description: |
        Malformed request: invalid JSON, missing required fields, invalid
        parameter values, or model rejected the request.
        Do not retry without changing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: 'Invalid value for ''temperature'': must be between 0 and 2'
              type: invalid_request_error
              code: invalid_parameter
              param: temperature
    forbidden:
      description: |
        API key lacks required scope, or the model is not in your plan.
        Upgrade your plan or use a different key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: Model 'gpt-5' is not available on your current plan
              type: permission_error
              code: model_not_accessible
              param: model
    server-error:
      description: |
        Server error. Either our gateway or an upstream provider failed.
        Safe to retry with exponential backoff. Report if persistent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: Upstream provider returned an error
              type: server_error
              code: upstream_error
              param: null
    not-found:
      description: |
        The requested resource does not exist. Check the URL and resource ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              message: Video task 'video_xyz' not found
              type: not_found_error
              code: resource_not_found
              param: task_id
